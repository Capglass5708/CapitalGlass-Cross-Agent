name: WESLEYDESK index publication runner smoke

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Operator reason for smoke check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cross-agent-wesleydesk-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, wesleydesk, wsl2]
    timeout-minutes: 10
    env:
      INTELLIGENCE_HUB_ROOT: /mnt/l/Capital-Glass-Intelligence-Hub
      CAPITALGLASS_CROSS_AGENT_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout pinned ref
        uses: actions/checkout@f43a0e5ff2bd294095638e18286a9b3e4e4c80c8
        with:
          fetch-depth: 1

      - uses: actions/setup-node@b789df37d6b7526a863bf51b65df64f3f56ffe4f
        with:
          node-version: '22'

      - name: Runner host + L mount preflight
        run: node scripts/runner/wesleydesk-index-publication-preflight.mjs --json

      - name: List runner labels (debug)
        run: echo "runner=$RUNNER_NAME labels on job matrix self-hosted,wesleydesk,wsl2"

      - name: Upload smoke receipt
        if: always()
        uses: actions/upload-artifact@26f96dfa697d400d5afdd50ce9da1e7f0835745a
        with:
          name: wesleydesk-runner-smoke-receipt
          path: artifacts/agent-runs/cross-agent-index-auto-publisher-activation-v1/wesleydesk-runner-preflight.json
